name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Built-extension browser tests
        run: npm run test:e2e

      - name: Production build
        run: npx vite build

      - name: Package for Chrome Web Store
        run: npm run package

      - name: Validate store package
        run: npm run validate:package

      # Shipped (production) dependencies: any advisory fails the gate.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      # The whole tree, dev tooling included: high and critical advisories fail
      # the gate. A moderate one in dev-only tooling (2026-11: minimatch
      # GHSA-g3hv-75wg-m249 under eslint, no compatible fix yet) is reported but
      # does not block; tighten back to plain `npm audit` once eslint moves on.
      - name: Audit all dependencies
        run: npm audit --audit-level=high
